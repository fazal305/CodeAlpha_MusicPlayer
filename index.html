<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeAlpha Music Player</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="player-styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="player-layout">
      <article class="player-card">
        <header class="player-header">
          <p class="eyebrow-text">CodeAlpha Internship Task</p>
          <h1>Music Player</h1>
          <p class="header-description">HTML, CSS, and JavaScript audio interface.</p>
        </header>

        <section class="cover-section">
          <div class="vinyl-disc" id="vinyl-disc">
            <div class="vinyl-ring"></div>

            <div class="vinyl-center">
              <img
                src="assets/covers/cover-01.jpg"
                alt="Vinyl center artwork"
                class="vinyl-cover"
                id="vinyl-cover"
              >

              <div class="vinyl-fallback" id="vinyl-fallback">LS</div>
            </div>
          </div>
        </section>

        <section class="song-info">
          <div class="title-mask">
            <h2 class="song-title" id="song-title">Late Shift Drive</h2>
          </div>

          <p class="song-artist" id="song-artist">Neon Valley</p>
        </section>

        <section class="progress-section">
          <div class="time-row">
            <span id="current-time">0:00</span>
            <span id="total-duration">0:00</span>
          </div>

          <input type="range" id="progress-bar" class="progress-bar" min="0" max="100" value="0">
        </section>

        <section class="controls-section">
          <button class="control-btn small-control" id="shuffle-btn" type="button">🔀</button>
          <button class="control-btn medium-control" id="prev-btn" type="button">⏮</button>
          <button class="control-btn play-control" id="play-btn" type="button">▶</button>
          <button class="control-btn medium-control" id="next-btn" type="button">⏭</button>
          <button class="control-btn small-control" id="repeat-btn" type="button">🔁</button>
        </section>

        <section class="volume-section">
          <button class="volume-btn" id="mute-btn" type="button">🔊</button>

          <input type="range" id="volume-slider" class="volume-slider" min="0" max="100" value="80">

          <span class="volume-value" id="volume-value">80%</span>
        </section>

        <button class="playlist-toggle" id="playlist-toggle" type="button">
          Show Playlist
        </button>
      </article>

      <aside class="playlist-panel" id="playlist-panel" hidden>
        <div class="playlist-header">
          <div>
            <p class="eyebrow-text">Queue</p>
            <h2>Playlist</h2>
          </div>

          <span class="track-count" id="track-count">5 tracks</span>
        </div>

        <div class="playlist-list" id="playlist-list"></div>
      </aside>
    </section>
  </main>

  <script src="player-script.js"></script>
</body>
</html>
